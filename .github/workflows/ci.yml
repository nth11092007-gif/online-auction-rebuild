name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: quan_ly_dau_gia
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -u root quan_ly_dau_gia < auction-server/src/main/java/com/auction/server/database/quan_ly_dau_gia.sql

      - name: CheckStyle
        run: mvn checkstyle:check

      - name: Run Tests
        run: mvn test -Dcheckstyle.skip=true

      - name: Package JARs
        run: mvn package -DskipTests

      - name: Upload Server and Client JARs
        uses: actions/upload-artifact@v4
        with:
          name: auction-system-jars
          path: |
            auction-server/target/*.jar
            auction-client/target/*.jar

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            auction-common/target/site/jacoco/
            auction-server/target/site/jacoco/
            auction-client/target/site/jacoco/
